<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CheckRonda · Painel do gestor</title>
<style>
:root{--bg:#F3F2F8;--sf:#fff;--sf2:#EBEAF2;--tx:#14161C;--mu:#6A7080;--ln:#E2E1EA;--br:#2450E6;--brt:#2450E6;--ok:#12945F;--late:#E5384D;--amb:#D98E1F;--teal:#0E9F9A}
@media(prefers-color-scheme:dark){:root{--bg:#0E1015;--sf:#181B22;--sf2:#20242D;--tx:#F4F5F8;--mu:#9AA1B2;--ln:#2A2F3A;--brt:#7C9BFF;--ok:#35D08A;--late:#FF6B7A;--amb:#F0A83A;--teal:#2CC7C0}.l-cla{display:none!important}.l-esc{display:inline!important}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1{font-size:26px;margin:0}h3{margin:0 0 14px;font-size:20px}h4{margin:18px 0 10px}
.mu{color:var(--mu)}.l-esc{display:none}.l-cla{display:inline}
#app{min-height:100vh}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--sf);border-right:1px solid var(--ln);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;margin:0 6px 18px}
.tile{width:36px;height:36px;border-radius:12px;background:#2450E6;display:grid;place-items:center;flex:none}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{all:unset;cursor:pointer;padding:11px 12px;border-radius:12px;font-weight:600;color:var(--mu)}
.nav button:hover{background:var(--sf2)}.nav button.on{background:var(--br);color:#fff}
.side .fim{margin-top:auto;font-size:12px;color:var(--mu);display:grid;gap:10px;padding:0 6px}
.cred img{height:20px;display:block;margin-top:4px}
.main{padding:26px 30px;max-width:1240px;width:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:18px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{border-radius:20px;padding:16px;background:var(--sf);border:1px solid var(--ln)}
.kpi b{display:block;font-size:30px;line-height:1.1}.kpi span{font-size:13px;color:var(--mu)}
.kpi.ok{background:color-mix(in srgb,var(--ok) 14%,var(--sf))}.kpi.late{background:color-mix(in srgb,var(--late) 14%,var(--sf))}.kpi.amb{background:color-mix(in srgb,var(--amb) 14%,var(--sf))}.kpi.br{background:var(--br);color:#fff;border-color:transparent}.kpi.br span{color:#ffffffbb}
.btn{all:unset;cursor:pointer;padding:10px 16px;border-radius:14px;font-weight:700;border:1.5px solid var(--ln);background:var(--sf);font-size:14px}
.btn:hover{background:var(--sf2)}.btn.pri{background:var(--br);color:#fff;border-color:transparent}.btn.pri:hover{filter:brightness(1.1)}.btn.sm{padding:6px 10px;font-size:13px;border-radius:10px}.btn.red{color:var(--late)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips .btn.on{background:var(--br);color:#fff;border-color:transparent}
input,select,textarea{font:inherit;color:inherit;background:var(--sf2);border:1.5px solid transparent;border-radius:14px;padding:11px 14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brt)}
label{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--mu);margin-bottom:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.filtros{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:14px;padding:12px}
.tbl{padding:0;overflow:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em;padding:12px 14px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--ln);vertical-align:middle}tr:last-child td{border:0}tr[data-a]{cursor:pointer}tr[data-a]:hover td{background:var(--sf2)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--sf2)}
.chip.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.chip.atrasada,.chip.late{color:var(--late);background:color-mix(in srgb,var(--late) 15%,transparent)}.chip.amb,.chip.reposicao,.chip.media{color:var(--amb);background:color-mix(in srgb,var(--amb) 16%,transparent)}.chip.limpeza,.chip.baixa{color:var(--teal);background:color-mix(in srgb,var(--teal) 16%,transparent)}.chip.alta{color:var(--late);background:color-mix(in srgb,var(--late) 15%,transparent)}.chip.concluida,.chip.resolvida{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.bar{margin-bottom:12px}.bar .t{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}.bar .t small{color:var(--mu);font-weight:500}
.bar i{display:block;height:10px;border-radius:6px;background:var(--sf2);margin-top:5px;overflow:hidden}.bar i s{display:block;height:100%;border-radius:6px;background:var(--c,var(--br))}
.dias{display:flex;align-items:flex-end;gap:8px;height:150px}.dias div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;font-size:12px}.dias i{display:block;width:100%;border-radius:8px;background:var(--br);min-height:4px}.dias i.z{background:var(--ln)}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fotos img{width:100%;border-radius:14px;max-height:260px;object-fit:cover;cursor:zoom-in}
.item{border:1px solid var(--ln);border-radius:18px;padding:16px;background:var(--sf);margin-bottom:12px}
dialog{border:0;border-radius:24px;padding:24px;width:min(560px,94vw);background:var(--sf);color:var(--tx);box-shadow:0 20px 60px #0006}dialog::backdrop{background:#000a}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 20px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99}#toast.on{opacity:1}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(420px,100%);padding:30px}.login h2{font-size:32px;margin:18px 0 6px}.erro{color:var(--late);font-weight:600;margin:10px 0}
.setup{max-width:720px;margin:40px auto;padding:0 20px}.setup code,.setup pre{background:var(--sf2);border-radius:10px;padding:2px 6px}.setup pre{padding:14px;overflow:auto}
@media(max-width:860px){.shell{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}.brand{margin:0 8px 0 0}.nav{flex-direction:row;overflow-x:auto}.side .fim{display:none}.main{padding:18px}.filtros{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}}
@media print{.side,.noprint,#toast{display:none!important}.shell{display:block}.main{padding:0}body{background:#fff;color:#000}.card,.kpi{border:1px solid #ccc;background:#fff!important;color:#000!important}.kpi.br{color:#000}}

const cacheFoto = new Map();
async function fotoSrc(ref) {
  if (!ref) return null;
  if (ref.startsWith('foto:')) {
    const id = ref.slice(5);
    if (cacheFoto.has(id)) return cacheFoto.get(id);
    const s = await getDoc(doc(db, 'fotos', id));
    const src = s.exists() && s.data().dados ? 'data:image/jpeg;base64,' + s.data().dados : null;
    cacheFoto.set(id, src); return src;
  }
  return ref.startsWith('http') ? ref : null;
}
async function carregaFotos(raiz) {
  for (const img of raiz.querySelectorAll('img[data-foto]')) {
    const src = await fotoSrc(img.dataset.foto).catch(() => null);
    if (src) { img.src = src; img.hidden = false; }
    else img.replaceWith(Object.assign(document.createElement('span'), { className: 'mu', textContent: 'Foto indisponível (ficou só no celular)' }));
  }
}

const bar = (rot, fr, txt, cor) => `<div class="bar"><div class="t"><span>${esc(rot)}</span><small>${esc(txt)}</small></div><i><s style="width:${Math.max(2, Math.min(100, fr * 100))}%;${cor ? `--c:${cor}` : ''}"></s></i></div>`;
function tarefasPeriodo() {
  if (S.periodo === 0) return S.tarefas;
  const ini = new Date(); ini.setHours(0, 0, 0, 0); ini.setDate(ini.getDate() - (S.periodo - 1));
  return S.tarefas.filter(t => new Date(t.horarioPrevisto) >= ini);
}
function vPainel(v) {
  v.dataset.rota = '';
  const ts = tarefasPeriodo(), conc = ts.filter(t => t.status === 'concluida');
  const atr = ts.filter(t => efetivo(t) === 'atrasada').length, pen = ts.filter(t => efetivo(t) === 'pendente').length;
  const taxa = ts.length ? Math.round(conc.length * 100 / ts.length) : 0;
  const m = media(conc.map(duracao).filter(x => x != null));
  const falta = S.tarefas.filter(t => t.produtoEmFalta).length, ocAb = S.ocorrencias.filter(o => o.status !== 'resolvida').length;
  const por = {}; ts.forEach(t => (por[t.idResponsavel] ||= []).push(t));
  const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
  const dias = [...Array(7)].map((_, i) => { const d = new Date(hoje); d.setDate(d.getDate() - (6 - i)); return d; });
  const porDia = dias.map(d => S.tarefas.filter(t => t.status === 'concluida' && t.horarioConclusao && new Date(t.horarioConclusao).toDateString() === d.toDateString()).length);
  const mx = Math.max(1, ...porDia);
  const tl = {}; conc.forEach(t => { const d = duracao(t); if (d != null) (tl[t.local] ||= []).push(d); });
  const medL = Object.entries(tl).map(([k, a]) => [k, media(a)]).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const rec = [...S.tarefas].filter(t => t.status === 'concluida' && t.horarioConclusao).sort((a, b) => new Date(b.horarioConclusao) - new Date(a.horarioConclusao)).slice(0, 8);
  v.innerHTML = `<div class="top"><h1>Painel</h1><div class="acts noprint"><div class="chips">${[[1, 'Hoje'], [7, '7 dias'], [30, '30 dias'], [0, 'Tudo']].map(([d, n]) => `<button class="btn sm ${S.periodo === d ? 'on' : ''}" data-a="periodo" data-v="${d}">${n}</button>`).join('')}</div><button class="btn sm" data-a="csv">Exportar CSV</button><button class="btn sm" data-a="imprimir">Imprimir</button></div></div>
  <div class="kpis"><div class="kpi br"><b>${taxa}%</b><span>conclusão (${conc.length} de ${ts.length})</span></div><div class="kpi ok"><b>${conc.length}</b><span>concluídas</span></div><div class="kpi"><b>${pen}</b><span>pendentes</span></div><div class="kpi late"><b>${atr}</b><span>em atraso</span></div><div class="kpi amb"><b>${falta}</b><span>produtos em falta</span></div><div class="kpi"><b>${ocAb}</b><span>ocorrências abertas</span></div><div class="kpi"><b>${m == null ? '—' : dur(m)}</b><span>tempo médio por tarefa</span></div></div>
  <div class="grid g2"><div class="card"><h4 style="margin-top:0">Por funcionário</h4>${Object.keys(por).length ? Object.entries(por).map(([id, a]) => { const c = a.filter(t => t.status === 'concluida').length, l = a.filter(t => efetivo(t) === 'atrasada').length; return bar(nomeDe(id), c / a.length, `${c}/${a.length} concluídas${l ? ` · ${l} em atraso` : ''}`, 'var(--ok)'); }).join('') : '<p class="mu">Sem tarefas no período.</p>'}</div>
  <div class="card"><h4 style="margin-top:0">Concluídas nos últimos 7 dias</h4><div class="dias">${porDia.map((n, i) => `<div><b>${n}</b><i class="${n ? '' : 'z'}" style="height:${n ? 8 + 100 * n / mx : 4}px"></i><span class="mu">${p2(dias[i].getDate())}/${p2(dias[i].getMonth() + 1)}</span></div>`).join('')}</div></div>
  <div class="card"><h4 style="margin-top:0">Tempo médio por local</h4>${medL.length ? medL.map(([k, ms]) => bar(k, ms / medL[0][1], dur(ms), 'var(--teal)')).join('') : '<p class="mu">Aparece depois das primeiras tarefas concluídas com check-in.</p>'}</div>
  <div class="card"><h4 style="margin-top:0">Últimas conclusões</h4>${rec.length ? rec.map(t => `<div style="display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln);cursor:pointer" data-a="verTarefa" data-id="${esc(t.id)}"><span><b>${esc(t.titulo)}</b><br><small class="mu">${esc(t.local)} · ${esc(nomeDe(t.idResponsavel))}</small></span><small class="mu">${dt(t.horarioConclusao)}</small></div>`).join('') : '<p class="mu">Nenhuma tarefa concluída ainda.</p>'}</div></div>`;
}

  <div class="row"><label>Tipo<select name="tipo"><option value="limpeza">Limpeza</option><option value="reposicao">Reposição</option></select></label><label>Responsável<select name="resp" required>${funcs.map(u => `<option value="${esc(u.id)}">${esc(u.nome)}</option>`).join('')}</select></label></div>
  <label>Horário previsto<input type="datetime-local" name="hora" required value="${agoraLocal()}"></label>
  <label>Checklist (um item por linha)<textarea name="check" rows="4" placeholder="Ex.: Varrer o corredor"></textarea></label>${btns('Salvar e atribuir')}</form>`);
}
function dlgPessoa() { abrir(`<h3>Adicionar pessoa</h3><form data-form="pessoa"><label>Nome completo<input name="nome" required></label><label>E-mail<input type="email" name="email" required></label><label>Perfil<select name="tipo"><option value="funcionario">Funcionário</option><option value="gestor">Gestor</option></select></label><p class="mu" style="font-size:13px">A pessoa recebe um e-mail para criar a própria senha.</p>${btns('Cadastrar e enviar convite')}</form>`); }
function dlgLocal() {
  abrir(`<h3>Novo local</h3><form data-form="local"><label>Nome do local<input name="nome" required placeholder="Ex.: Corredor 4"></label><div class="row"><label>Latitude (opcional)<input name="lat" inputmode="decimal"></label><label>Longitude (opcional)<input name="lng" inputmode="decimal"></label></div><button type="button" class="btn sm" data-a="minhaPos" style="margin-bottom:12px">Usar minha posição atual</button>${btns('Salvar e gerar QR')}</form>`);
}
function dlgAviso() { abrir(`<h3>Novo aviso</h3><form data-form="aviso"><label>Título<input name="titulo" required></label><label>Mensagem<textarea name="msg" rows="4" required></textarea></label>${btns('Publicar')}</form>`); }
function dlgQr(l) {
  abrir(`<h3>${esc(l.nome)}</h3><div style="display:grid;place-items:center;padding:10px"><div id="qrbox" style="background:#fff;padding:12px;border-radius:12px"></div></div><p class="mu" style="text-align:center;font-size:13px">Imprima e fixe no local. O código é único e só vale para este local.</p><div class="acts" style="justify-content:center"><button class="btn pri" data-a="imprimirQr" data-nome="${esc(l.nome)}">Imprimir</button><button class="btn" data-a="fechar">Fechar</button></div>`);
  new QRCode($('#qrbox'), { text: l.codigoQr, width: 220, height: 220 });
}

const senhaAleatoria = () => { const L = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#%'; const a = new Uint32Array(24); crypto.getRandomValues(a); return [...a].map(n => L[n % L.length]).join(''); };
const novoCodigo = () => { const L = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const a = new Uint32Array(10); crypto.getRandomValues(a); return 'CR-' + [...a].map(n => L[n % L.length]).join(''); };

const FORMS = {
  async login(d) {
    try { await signInWithEmailAndPassword(auth, d.email.trim(), d.senha); }
    catch (e) { renderLogin(['auth/invalid-credential', 'auth/wrong-password', 'auth/user-not-found'].includes(e.code) ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + (e.code || e.message)); }
  },
  async tarefa(d) {
    const loc = S.locais.find(l => l.id === d.local), id = String(Date.now());
    const checklist = d.check.split('\n').map(s => s.trim()).filter(Boolean).map(titulo => ({ titulo, concluido: false }));
    await setDoc(doc(db, 'tarefas', id), { id, titulo: d.titulo.trim(), local: loc.nome, qrCodeEsperado: loc.codigoQr, tipo: d.tipo, horarioPrevisto: d.hora.length === 16 ? d.hora + ':00' : d.hora, idResponsavel: d.resp, status: 'pendente', checklist: checklist.length ? checklist : [{ titulo: 'Verificação padrão', concluido: false }], observacao: null, fotoAntesPath: null, fotoDepoisPath: null, produtoEmFalta: false, horarioConclusao: null, latitudeCheckin: null, longitudeCheckin: null, latitudeLocal: loc.latitude ?? null, longitudeLocal: loc.longitude ?? null, idModelo: null, horarioInicio: null });
    const n = doc(collection(db, 'notificacoes'));
    await setDoc(n, { id: n.id, idUsuario: d.resp, titulo: 'Nova Atividade Atribuída!', mensagem: `Você recebeu a tarefa "${d.titulo.trim()}" no local ${loc.nome}.`, data: isoLocal(new Date()), lida: false });
    fechar(); toast('Tarefa criada e atribuída');
  },
  async pessoa(d, f) {
    const btn = f.querySelector('.pri'); btn.disabled = true; btn.textContent = 'Cadastrando...';
    const email = d.email.trim().toLowerCase();
    const sec = getApps().find(a => a.name === 'cadastro') || initializeApp(FIREBASE_CONFIG, 'cadastro');
    const as = getAuth(sec); as.languageCode = 'pt-BR';
    try {
      const c = await createUserWithEmailAndPassword(as, email, senhaAleatoria());
      await updateProfile(c.user, { displayName: d.nome.trim() });
      await setDoc(doc(db, 'usuarios', c.user.uid), { id: c.user.uid, nome: d.nome.trim(), username: email, senha: '', tipo: d.tipo, fotoPath: null, ativo: true, consentimentoEm: null });
      await sendPasswordResetEmail(as, email);
      fechar(); toast('Cadastro criado. Convite enviado para ' + email);
    } catch (e) { btn.disabled = false; btn.textContent = 'Cadastrar e enviar convite'; toast(e.code === 'auth/email-already-in-use' ? 'Este e-mail já tem cadastro. Use "Reenviar convite" na lista.' : 'Erro: ' + (e.code || e.message)); }
    finally { await signOut(as).catch(() => { }); }
  },
  async local(d) {
    const r = doc(collection(db, 'locais')), lat = parseFloat(String(d.lat).replace(',', '.')), lng = parseFloat(String(d.lng).replace(',', '.'));
    const l = { nome: d.nome.trim(), codigoQr: novoCodigo(), latitude: isNaN(lat) ? null : lat, longitude: isNaN(lng) ? null : lng };
    await setDoc(r, l); toast('Local salvo'); dlgQr({ id: r.id, ...l });
  },
  async aviso(d) {
    const id = String(Date.now());
    await setDoc(doc(db, 'avisos', id), { id, titulo: d.titulo.trim(), mensagem: d.msg.trim(), data: isoLocal(new Date()), autor: S.perfil.nome });
    fechar(); toast('Aviso publicado');
  }
};

/* ---------- exportar / imprimir ---------- */
function exportaCsv() {
  const cel = c => { let s = String(c ?? ''); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
  const f = v => v ? isoLocal(new Date(v)).replace('T', ' ') : '';
  const cab = ['Título', 'Local', 'Responsável', 'Tipo', 'Status', 'Previsto', 'Início', 'Concluído', 'Duração', 'Produto em falta', 'Observação', 'Latitude check-in', 'Longitude check-in'];
  const lin = tarefasPeriodo().map(t => { const d = duracao(t); return [t.titulo, t.local, nomeDe(t.idResponsavel), R_TP[t.tipo], R_ST[efetivo(t)], f(t.horarioPrevisto), f(t.horarioInicio), f(t.horarioConclusao), d != null ? dur(d) : '', t.produtoEmFalta ? 'Sim' : 'Não', t.observacao, t.latitudeCheckin, t.longitudeCheckin]; });
  const csv = '\ufeff' + [cab, ...lin].map(l => l.map(cel).join(';')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'checkronda-tarefas.csv'; a.click();
}

/* ---------- ações (cliques) ---------- */
const A = {
  rota: b => { S.rota = b.r; $('#view').dataset.rota = ''; render(); },
  periodo: b => { S.periodo = +b.v; render(); },
  sair: () => signOut(auth),
  fechar,
  ampliar: (b, el) => { const w = window.open(); if (w) { w.document.write(`<title>Foto</title><body style="margin:0;background:#000;display:grid;place-items:center;min-height:100vh"><img src="${el.src}" style="max-width:100%;max-height:100vh">`); w.document.close(); } },
  csv: exportaCsv, imprimir: () => window.print(),
  verTarefa: b => verTarefa(b.id), novaTarefa: dlgTarefa,
  delTarefa: async b => { if (confirm('Excluir esta tarefa para todos? Isso não pode ser desfeito.')) deleteDoc(doc(db, 'tarefas', b.id)).then(() => toast('Tarefa excluída')).catch(erro); },
  filtroOc: b => { S.fo = b.v; render(); },
  reposto: b => updateDoc(doc(db, 'tarefas', b.id), { produtoEmFalta: false }).then(() => toast('Marcado como reposto')).catch(erro),
  novaPessoa: dlgPessoa,
  convite: b => sendPasswordResetEmail(auth, b.email).then(() => toast('Convite reenviado para ' + b.email)).catch(erro),
  tipoU: b => confirm(b.v === 'gestor' ? 'Esta pessoa passará a ver os dados de todos. Confirmar?' : 'Esta pessoa deixará de ser gestora. Confirmar?') && updateDoc(doc(db, 'usuarios', b.id), { tipo: b.v }).catch(erro),
  ativo: b => (b.v === '1' || confirm('A pessoa perde o acesso ao app e ao painel. Você pode reativar depois. Desativar?')) && updateDoc(doc(db, 'usuarios', b.id), { ativo: b.v === '1' }).catch(erro),
  novoLocal: dlgLocal,
  minhaPos: () => navigator.geolocation?.getCurrentPosition(p => { const f = $('form[data-form=local]'); f.lat.value = p.coords.latitude.toFixed(6); f.lng.value = p.coords.longitude.toFixed(6); toast('Posição preenchida'); }, () => toast('Não foi possível obter a posição.')),
  verQr: b => { const l = S.locais.find(x => x.id === b.id); if (l) dlgQr(l); },
  delLocal: b => confirm('Excluir este local? Tarefas já criadas continuam com o QR antigo.') && deleteDoc(doc(db, 'locais', b.id)).catch(erro),
  imprimirQr: b => { const c = $('#qrbox canvas'), src = c ? c.toDataURL('image/png') : $('#qrbox img').src; const w = window.open(); if (!w) return toast('Libere pop-ups para imprimir.'); w.document.write(`<title>QR</title><body style="font-family:sans-serif;text-align:center;padding:40px"><h2>CHECK-IN RONDA · LOCALIZAÇÃO</h2><h1>${esc(b.nome)}</h1><img src="${src}" width="320"><script>onload=()=>print()<\/script>`); w.document.close(); },
  novoAviso: dlgAviso,
  delAviso: b => confirm('Excluir este aviso?') && deleteDoc(doc(db, 'avisos', b.id)).catch(erro),
  google: async () => { try { await signInWithPopup(auth, new GoogleAuthProvider()); } catch (e) { if (e.code !== 'auth/popup-closed-by-user') renderLogin('Não foi possível entrar com o Google: ' + (e.code || e.message)); } },
  esqueci: async () => { const e = prompt('Digite o e-mail da sua conta:'); if (e) sendPasswordResetEmail(auth, e.trim()).then(() => toast('Se o e-mail tiver conta, enviamos o link para criar a senha.')).catch(erro); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  if (el.tagName === 'A') e.preventDefault();
  A[el.dataset.a]?.(el.dataset, el);
});
document.addEventListener('input', e => { const k = e.target.dataset?.f; if (k) { S.f[k] = e.target.value; render(); } });
document.addEventListener('change', e => {
  const k = e.target.dataset?.f; if (k) { S.f[k] = e.target.value; render(); }
  if (e.target.dataset?.oc) updateDoc(doc(db, 'ocorrencias', e.target.dataset.oc), { status: e.target.value }).then(() => toast('Status atualizado')).catch(erro);
});
document.addEventListener('submit', async e => {
  const f = e.target, k = f.dataset?.form; if (!k) return;
  e.preventDefault();
  try { await FORMS[k](Object.fromEntries(new FormData(f)), f); } catch (err) { erro(err); }
});

/* ---------- início ---------- */
if (!configurado) telaConfig();
else {
  app = initializeApp(FIREBASE_CONFIG); auth = getAuth(app); auth.languageCode = 'pt-BR'; db = getFirestore(app, DB_ID);
  renderLogin();
  onAuthStateChanged(auth, async u => {
    desinscrever();
    if (!u) { S.user = null; S.perfil = null; renderLogin(); return; }
    try {
      const s = await getDoc(doc(db, 'usuarios', u.uid));
      const p = s.exists() ? { ...s.data(), id: s.id } : null;
      if (!p || p.tipo !== 'gestor' || p.ativo === false) {
        S.aviso = !p ? 'Este e-mail não está cadastrado no CheckRonda. Fale com o gestor.' : (p.ativo === false ? 'Conta desativada.' : 'Este painel é só para gestores.');
        if (!p) await deleteUser(u).catch(() => { });
        await signOut(auth); return;
      }
      S.user = u; S.perfil = p; renderShell(); assinar();
    } catch (err) { S.aviso = 'Não foi possível verificar o acesso: ' + (err.code || err.message); await signOut(auth); }
  });
}
</script>
</body>
</html>
